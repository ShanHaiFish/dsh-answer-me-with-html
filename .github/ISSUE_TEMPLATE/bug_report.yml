name: Bug report
description: Something in the plugin does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please include enough detail to reproduce the problem.
  - type: input
    id: dsh-version
    attributes:
      label: DSH version
      description: Desktop or `dsh --version`
      placeholder: 0.2.2-rc.1
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - DSH Desktop
        - DSH Web
        - Both
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The actual result, including any error text, tool result or page path.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Ask "..."
        2. Click "Open page"
        3. See ...
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Console errors, plugin manager diagnostics, or a screenshot of the tool card.
