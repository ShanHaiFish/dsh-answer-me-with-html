# dsh-answer-me-with-html bundle patch.
#
# Two rows:
#   - answer-me-with-html       our Host plugin: registers the `answer_me_with_html`
#                               tool and (optionally) the always-on prompt section.
#   - answer-me-with-html-skill mounts the bundled skill/ directory through the
#                               shipped filesystem skill provider.
#
# The skill row resolves this package from the profile's node_modules, so the
# bundledSkillDir expression never depends on the process working directory.
- insert:
    - id: answer-me-with-html
      name: dsh-answer-me-with-html
      config:
        outputDir: ''
        theme: auto
        mode: auto
        style: '80'
        alwaysOn: false
        nodePath: ''
        maxDraftBytes: 200000
    - id: answer-me-with-html-skill
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: answer-me-with-html
        includeDefaultRoots: false
        bundledSkillDir: !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-answer-me-with-html/package.json')), 'skill')
